<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="theme-banner">ДЖУНГЛИ</div>

    <div id="start-screen" class="overlay">
        <h1>MONKEY JUMPER</h1>
        <p>Веди пальцем влево и вправо по экрану, чтобы вести Обезьянку! 🐵<br><br>Прыгай по платформам и забей рекорд!</p>
        <button id="start-btn" class="btn">ИГРАТЬ</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #f87171; text-shadow: 0 4px 10px rgba(248, 113, 113, 0.3);">ИГРА ОКОНЧЕНА</h1>
        <div class="score-card">
            <div>Счёт: <span id="final-score" class="highlight">0</span></div>
            <div>Рекорд: <span id="best-score" class="highlight">0</span></div>
        </div>
        <button id="restart-btn" class="btn">ИГРАТЬ СНОВА</button>
    </div>
</div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.exponentialRampToValueAtTime(560, now + 0.12);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'spring') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.linearRampToValueAtTime(850, now + 0.25);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(30, now + 0.18);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.5);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'levelup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.08);
            osc.frequency.setValueAtTime(659, now + 0.16);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    } catch(e) {}
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

let width = 400;
let height = 600;

function resizeCanvas() {
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width;
    canvas.height = height;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let isGameRunning = false;
let maxHeightReached = 0;
let score = 0;
let highScore = localStorage.getItem('monkey_jumper_highscore') || 0;
let currentThemeIndex = 0;

const themes = [
    { name: 'ДЖУНГЛИ', minScore: 0, bgTop: '#134e4a', bgBottom: '#064e3b', platColor: '#22c55e' },
    { name: 'МУЛЬТЯШНЫЙ МИР', minScore: 300, bgTop: '#38bdf8', bgBottom: '#e0f2fe', platColor: '#f43f5e' },
    { name: 'НЕОНОВЫЙ ГОРОД', minScore: 700, bgTop: '#311042', bgBottom: '#0f051d', platColor: '#06b6d4' },
    { name: 'КОСМОС', minScore: 1200, bgTop: '#090d16', bgBottom: '#020408', platColor: '#a855f7' }
];

const monkey = {
    x: 0,
    y: 0,
    width: 44,
    height: 44,
    vy: 0,
    targetX: 0,
    gravity: 0.36,
    jumpForce: -11.2,
    facingRight: true,

    reset() {
        this.x = width / 2 - this.width / 2;
        this.y = height - 160;
        this.targetX = this.x + this.width / 2;
        this.vy = this.jumpForce;
    },

    update() {
        let dx = this.targetX - (this.x + this.width / 2);
        this.x += dx * 0.22;

        if (this.x > width) this.x = -this.width;
        else if (this.x < -this.width) this.x = width;

        if (dx > 2) this.facingRight = true;
        else if (dx < -2) this.facingRight = false;

        this.vy += this.gravity;
        this.y += this.vy;
    },

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        if (!this.facingRight) ctx.scale(-1, 1);

        // Tail
        ctx.beginPath();
        ctx.strokeStyle = '#6c3b18';
        ctx.lineWidth = 4;
        ctx.arc(-12, 8, 10, 0, Math.PI);
        ctx.stroke();

        // Body
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.ellipse(0, 6, 16, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Tummy
        ctx.fillStyle = '#d2b48c';
        ctx.beginPath();
        ctx.ellipse(0, 8, 10, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.arc(-16, -6, 7, 0, Math.PI * 2);
        ctx.arc(16, -6, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#d2b48c';
        ctx.beginPath();
        ctx.arc(-16, -6, 4, 0, Math.PI * 2);
        ctx.arc(16, -6, 4, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.arc(0, -6, 16, 0, Math.PI * 2);
        ctx.fill();

        // Face
        ctx.fillStyle = '#d2b48c';
        ctx.beginPath();
        ctx.ellipse(0, -2, 12, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-5, -6, 2.5, 0, Math.PI * 2);
        ctx.arc(5, -6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Eye glints
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-6, -7, 1, 0, Math.PI * 2);
        ctx.arc(4, -7, 1, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#4a2506';
        ctx.beginPath();
        ctx.arc(0, -2, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
};

let platforms = [];

class Platform {
    constructor(x, y, type = 'normal') {
        this.x = x;
        this.y = y;
        this.width = 68;
        this.height = 14;
        this.type = type;
        this.broken = false;
        this.vx = (type === 'moving') ? (Math.random() < 0.5 ? 1.5 : -1.5) : 0;
    }

    update() {
        if (this.type === 'moving') {
            this.x += this.vx;
            if (this.x <= 0 || this.x + this.width >= width) {
                this.vx *= -1;
            }
        }
    }

    draw() {
        if (this.broken) return;

        ctx.save();
        const theme = themes[currentThemeIndex];

        if (this.type === 'normal') {
            ctx.fillStyle = theme.platColor;
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 7);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(this.x + 5, this.y + 2, this.width - 10, 3);
        } else if (this.type === 'moving') {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 7);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x + 8, this.y + 5, 4, 4);
            ctx.fillRect(this.x + this.width - 12, this.y + 5, 4, 4);
        } else if (this.type === 'spring') {
            ctx.fillStyle = theme.platColor;
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 7);
            ctx.fill();

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x + this.width/2 - 8, this.y - 8, 16, 8);
        } else if (this.type === 'breaking') {
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 5);
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y + 2);
            ctx.lineTo(this.x + 30, this.y + 12);
            ctx.lineTo(this.x + 50, this.y + 2);
            ctx.stroke();
        }

        ctx.restore();
    }
}

function generateInitialPlatforms() {
    platforms = [];
    platforms.push(new Platform(width / 2 - 34, height - 80, 'normal'));

    let y = height - 150;
    while (y > 0) {
        let x = Math.random() * (width - 70);
        let type = 'normal';
        let rand = Math.random();
        if (rand < 0.18) type = 'moving';
        else if (rand < 0.3) type = 'spring';
        else if (rand < 0.42) type = 'breaking';

        platforms.push(new Platform(x, y, type));
        y -= 52 + Math.random() * 22;
    }
}

function handleMove(evt) {
    if (!isGameRunning) return;
    let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    let rect = canvas.getBoundingClientRect();
    monkey.targetX = clientX - rect.left;
}

window.addEventListener('touchstart', (e) => {
    initAudio();
    handleMove(e);
}, { passive: true });

window.addEventListener('touchmove', handleMove, { passive: true });
window.addEventListener('mousemove', handleMove);

const stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 2 + 1
}));

function drawBackground() {
    const theme = themes[currentThemeIndex];
    let grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, theme.bgTop);
    grad.addColorStop(1, theme.bgBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    if (currentThemeIndex === 1) { // Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(60, 100, 30, 0, Math.PI * 2);
        ctx.arc(90, 100, 40, 0, Math.PI * 2);
        ctx.arc(320, 220, 50, 0, Math.PI * 2);
        ctx.fill();
    } else if (currentThemeIndex === 2) { // Neon Grid
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 30) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }
    } else if (currentThemeIndex === 3) { // Stars
        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }
}

function showThemeBanner(name) {
    const banner = document.getElementById('theme-banner');
    banner.innerText = name;
    banner.style.opacity = '1';
    setTimeout(() => {
        banner.style.opacity = '0';
    }, 2000);
}

function updateGame() {
    if (!isGameRunning) return;

    monkey.update();

    // Camera follow player
    if (monkey.y < height * 0.45) {
        let diff = height * 0.45 - monkey.y;
        monkey.y = height * 0.45;
        
        // SLOW BALANCED SCORE CALCULATION (divided by 12)
        maxHeightReached += diff;
        score = Math.floor(maxHeightReached / 12);

        platforms.forEach(p => {
            p.y += diff;
        });

        // Theme transition check
        for (let i = themes.length - 1; i >= 0; i--) {
            if (score >= themes[i].minScore && currentThemeIndex < i) {
                currentThemeIndex = i;
                playSound('levelup');
                showThemeBanner(themes[i].name);
                break;
            }
        }
    }

    // Platform collisions
    platforms.forEach(p => {
        p.update();

        if (monkey.vy > 0 &&
            monkey.x + monkey.width > p.x &&
            monkey.x < p.x + p.width &&
            monkey.y + monkey.height >= p.y &&
            monkey.y + monkey.height <= p.y + p.height + 12) {

            if (p.type === 'breaking') {
                p.broken = true;
                playSound('break');
            } else if (p.type === 'spring') {
                monkey.vy = monkey.jumpForce * 1.55;
                playSound('spring');
            } else {
                monkey.vy = monkey.jumpForce;
                playSound('jump');
            }
        }
    });

    // Recycle platforms
    platforms = platforms.filter(p => p.y < height && !p.broken);
    while (platforms.length < 9) {
        let highestY = Math.min(...platforms.map(p => p.y));
        let x = Math.random() * (width - 70);
        let type = 'normal';
        let rand = Math.random();
        if (rand < 0.22) type = 'moving';
        else if (rand < 0.36) type = 'spring';
        else if (rand < 0.5) type = 'breaking';

        platforms.push(new Platform(x, highestY - (50 + Math.random() * 25), type));
    }

    // Check Game Over
    if (monkey.y > height + 60) {
        gameOver();
    }
}

function drawGame() {
    drawBackground();

    platforms.forEach(p => p.draw());
    monkey.draw();

    // HUD Score
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(`Счёт: ${score}`, 18, 36);
    ctx.shadowBlur = 0;
}

function gameLoop() {
    updateGame();
    drawGame();
    if (isGameRunning) {
        requestAnimationFrame(gameLoop);
    }
}

function startGame() {
    initAudio();
    maxHeightReached = 0;
    score = 0;
    currentThemeIndex = 0;
    isGameRunning = true;
    monkey.reset();
    generateInitialPlatforms();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');

    requestAnimationFrame(gameLoop);
}

function gameOver() {
    isGameRunning = false;
    playSound('gameover');

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('monkey_jumper_highscore', highScore);
    }

    document.getElementById('final-score').innerText = score;
    document.getElementById('best-score').innerText = highScore;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
